<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="1340" height="640" fill="#F4EEE2"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#2E2622">Open-front workshop: plan and street view (Direction A)</text>
  <text x="40" y="70" font-size="14" fill="#5B514A">Plan at 14 px/stud, street view at 12 px/stud. The open side faces the village path (+Z), where customers come in from (13, 3, 30). Station positions are the current ones except the Ore Roller.</text>

  <!-- ================= PLAN ================= -->
  <text x="40" y="104" font-size="16" font-weight="700" fill="#2E2622">Plan (looking down; path at the bottom)</text>
  <!-- village road + approach -->
  <rect x="30" y="452" width="660" height="66" fill="#B8AE9C"/>
  <rect x="502" y="400" width="56" height="140" fill="#CFC6B4"/>
  <text x="40" y="490" font-size="12" fill="#5B514A">village path</text>
  <text x="530" y="560" font-size="11" fill="#5B514A" text-anchor="middle">customers walk in</text>
  <!-- floor zones -->
  <rect x="82" y="162" width="350" height="238" fill="#8A6E55"/>
  <rect x="432" y="162" width="224" height="238" fill="#C9BFAE"/>
  <text x="96" y="182" font-size="12" fill="#F4EEE2">earth floor (doma): hot work</text>
  <text x="446" y="182" font-size="12" fill="#5B514A">stone floor: shop</text>
  <!-- walls -->
  <rect x="78" y="158" width="582" height="8" fill="#2E2622"/>
  <rect x="78" y="158" width="8" height="246" fill="#2E2622"/>
  <rect x="652" y="158" width="8" height="246" fill="#2E2622"/>
  <!-- front posts -->
  <g fill="#2E2622">
    <rect x="78" y="396" width="8" height="8"/><rect x="160" y="396" width="8" height="8"/><rect x="242" y="396" width="8" height="8"/>
    <rect x="324" y="396" width="8" height="8"/><rect x="406" y="396" width="8" height="8"/><rect x="488" y="396" width="8" height="8"/>
    <rect x="570" y="396" width="8" height="8"/><rect x="652" y="396" width="8" height="8"/>
  </g>
  <!-- eave line -->
  <line x1="54" y1="428" x2="684" y2="428" stroke="#5C6670" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="684" y="444" font-size="11" fill="#5C6670" text-anchor="end">roof eave (2 studs past the posts)</text>
  <!-- stations -->
  <rect x="96" y="232" width="104" height="56" fill="none" stroke="#F4EEE2" stroke-width="2"/>
  <text x="148" y="264" font-size="12" fill="#F4EEE2" text-anchor="middle">Ore shrine</text>
  <text x="148" y="300" font-size="10" fill="#F4EEE2" text-anchor="middle">moves to x = -15</text>
  <rect x="210" y="246" width="28" height="26" fill="#B9875A"/>
  <rect x="237" y="241" width="45" height="39" fill="#A86E4A" stroke="#C8452F" stroke-width="2"/>
  <text x="258" y="230" font-size="12" fill="#F4EEE2" text-anchor="middle">Forge (+ bellows)</text>
  <circle cx="348" cy="260" r="34" fill="none" stroke="#FFD27A" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="327" y="251" width="42" height="18" fill="#3A3D44" stroke="#C8452F" stroke-width="2"/>
  <text x="348" y="312" font-size="10" fill="#FFD27A" text-anchor="middle">keep clear for the</text>
  <text x="348" y="324" font-size="10" fill="#FFD27A" text-anchor="middle">forging camera</text>
  <text x="348" y="218" font-size="12" fill="#F4EEE2" text-anchor="middle">Anvil</text>
  <rect x="424" y="248" width="45" height="25" fill="#8A5A3A" stroke="#C8452F" stroke-width="2"/>
  <text x="438" y="292" font-size="12" fill="#5B514A">Hilt Bench</text>
  <!-- display deck + holders -->
  <rect x="446" y="314" width="196" height="26" fill="#2E2622"/>
  <g fill="#E9E2D0"><rect x="448" y="322" width="26" height="6"/><rect x="518" y="322" width="26" height="6"/><rect x="588" y="322" width="26" height="6"/></g>
  <g fill="none" stroke="#C8452F" stroke-width="2"><circle cx="460" cy="325" r="5"/><circle cx="530" cy="325" r="5"/><circle cx="600" cy="325" r="5"/></g>
  <text x="544" y="355" font-size="11" fill="#5B514A" text-anchor="middle">holders 1-3, 5 studs apart</text>
  <circle cx="530" cy="372" r="7" fill="#9A9089"/>
  <text x="544" y="392" font-size="10" fill="#5B514A" text-anchor="middle">customer inspects here (13, -6.5)</text>
  <!-- growth hints -->
  <path d="M664,326 L700,326" stroke="#4CB050" stroke-width="3" marker-end="url(#ar)"/>
  <text x="664" y="314" font-size="11" fill="#4C8A3F">more holders</text>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4CB050"/></marker></defs>
  <!-- compass -->
  <text x="40" y="150" font-size="11" fill="#5B514A">back wall = -Z</text>
  <text x="40" y="604" font-size="12" fill="#5B514A">Footprint about 41 × 17 studs (x -19 to 22, z -21 to -4), 7 bays of about 6.8 studs.</text>
  <text x="40" y="622" font-size="12" fill="#5B514A">Old prototype blocks (store, creation area, the two "Part" slabs) move to ServerStorage.Archive.</text>

  <!-- ================= STREET VIEW ================= -->
  <text x="740" y="104" font-size="16" font-weight="700" fill="#2E2622">Street view (from the path)</text>
  <!-- mountains -->
  <polygon points="720,520 820,300 900,380 1000,240 1110,360 1190,280 1330,520" fill="#C9D3D6"/>
  <polygon points="720,520 790,420 860,470 940,400 1040,470 1130,410 1220,470 1330,430 1330,520" fill="#A9B8B3"/>
  <!-- pines -->
  <g fill="#5E7D5A"><polygon points="736,520 752,450 768,520"/><polygon points="1300,520 1316,440 1332,520"/></g>
  <!-- back wall: plaster with dark wainscot and timber band -->
  <rect x="796" y="388" width="492" height="125" fill="#E9E2D0"/>
  <rect x="796" y="476" width="492" height="37" fill="#4A3B33"/>
  <rect x="796" y="432" width="492" height="6" fill="#2E2622"/>
  <!-- stations in silhouette -->
  <rect x="800" y="460" width="92" height="6" fill="#2E2622"/><rect x="802" y="466" width="6" height="54" fill="#2E2622"/><rect x="884" y="466" width="6" height="54" fill="#2E2622"/>
  <rect x="836" y="494" width="20" height="26" fill="#8C8A84"/><polygon points="838,494 846,484 856,494" fill="#7FB2D6"/>
  <rect x="902" y="496" width="22" height="24" fill="#B9875A"/>
  <rect x="921" y="489" width="38" height="31" fill="#A86E4A"/><rect x="930" y="500" width="20" height="9" rx="3" fill="#FF8A3A"/>
  <polygon points="918,489 962,489 950,452 930,452" fill="#D8D0BC"/>
  <rect x="932" y="282" width="16" height="172" fill="#A86E4A"/><rect x="929" y="276" width="22" height="8" fill="#2E2622"/>
  <rect x="1006" y="482" width="36" height="7" fill="#2F3238"/><rect x="1010" y="489" width="28" height="11" fill="#3A3D44"/><rect x="1007" y="500" width="34" height="20" fill="#8A5A3A"/>
  <rect x="1089" y="484" width="38" height="4" fill="#C69A6A"/><rect x="1092" y="488" width="32" height="27" fill="#8A5A3A"/><rect x="1086" y="515" width="44" height="5" fill="#C9C08A"/>
  <rect x="1092" y="446" width="32" height="36" fill="#B9875A"/>
  <rect x="1132" y="510" width="146" height="10" fill="#2E2622"/>
  <g stroke="#D8DDE4" stroke-width="3"><line x1="1134" y1="499" x2="1170" y2="497"/><line x1="1194" y1="499" x2="1230" y2="497"/><line x1="1254" y1="499" x2="1278" y2="498"/></g>
  <g fill="#1E1A18"><rect x="1140" y="500" width="24" height="10"/><rect x="1200" y="500" width="24" height="10"/><rect x="1250" y="500" width="24" height="10"/></g>
  <!-- posts -->
  <g fill="#2E2622">
    <rect x="791" y="388" width="10" height="132"/><rect x="875" y="388" width="10" height="132"/><rect x="959" y="388" width="10" height="132"/>
    <rect x="1043" y="388" width="10" height="132"/><rect x="1127" y="388" width="10" height="132"/><rect x="1211" y="388" width="10" height="132"/>
    <rect x="1283" y="388" width="10" height="132"/>
  </g>
  <rect x="784" y="380" width="516" height="10" fill="#2E2622"/>
  <!-- plinth -->
  <rect x="790" y="513" width="504" height="7" fill="#8C8A84"/>
  <!-- noren over the shop bays -->
  <g fill="#2D3F66">
    <rect x="1053" y="390" width="36" height="30"/><rect x="1091" y="390" width="36" height="30"/>
    <rect x="1137" y="390" width="36" height="30"/><rect x="1175" y="390" width="36" height="30"/>
    <rect x="1221" y="390" width="30" height="30"/><rect x="1253" y="390" width="30" height="30"/>
  </g>
  <circle cx="1174" cy="405" r="9" fill="none" stroke="#F4EEE2" stroke-width="2"/><line x1="1174" y1="397" x2="1174" y2="413" stroke="#F4EEE2" stroke-width="2"/>
  <!-- roof: hip-and-gable silhouette, tile grey -->
  <polygon points="764,392 1320,392 1236,318 848,318" fill="#5C6670"/>
  <g stroke="#4A535C" stroke-width="2"><line x1="790" y1="370" x2="1294" y2="370"/><line x1="814" y1="348" x2="1270" y2="348"/><line x1="836" y1="328" x2="1248" y2="328"/></g>
  <rect x="842" y="308" width="400" height="12" fill="#3E454D"/>
  <polygon points="836,320 848,298 858,320" fill="#3E454D"/><polygon points="1226,320 1236,298 1248,320" fill="#3E454D"/>
  <!-- chimney through roof (redrawn on top) -->
  <rect x="932" y="282" width="16" height="40" fill="#A86E4A"/><rect x="929" y="276" width="22" height="8" fill="#2E2622"/>
  <!-- signboard -->
  <rect x="1120" y="352" width="120" height="28" fill="#B9875A" stroke="#2E2622" stroke-width="3"/>
  <text x="1180" y="373" font-size="18" font-weight="700" fill="#2E2622" text-anchor="middle">刀鍛冶</text>
  <!-- lanterns -->
  <g><line x1="1048" y1="390" x2="1048" y2="398" stroke="#2E2622" stroke-width="2"/><ellipse cx="1048" cy="410" rx="9" ry="12" fill="#E0532F"/><rect x="1041" y="397" width="14" height="3" fill="#2E2622"/><rect x="1041" y="420" width="14" height="3" fill="#2E2622"/></g>
  <g><line x1="1288" y1="390" x2="1288" y2="398" stroke="#2E2622" stroke-width="2"/><ellipse cx="1288" cy="410" rx="9" ry="12" fill="#E0532F"/><rect x="1281" y="397" width="14" height="3" fill="#2E2622"/><rect x="1281" y="420" width="14" height="3" fill="#2E2622"/></g>
  <!-- ground -->
  <rect x="720" y="520" width="610" height="24" fill="#6B5644"/>
  <!-- scale figure at the shop front -->
  <circle cx="1180" cy="466" r="7" fill="#9A9089"/><rect x="1172" y="473" width="16" height="22" rx="2" fill="#9A9089"/><rect x="1173" y="495" width="6" height="25" fill="#9A9089"/><rect x="1181" y="495" width="6" height="25" fill="#9A9089"/>
  <text x="740" y="566" font-size="12" fill="#5B514A">Eaves at 11 studs, ridge about 17, hood chimney to 19. Inside: Ore shrine · Forge · Anvil · Hilt Bench · holders.</text>
  <text x="740" y="584" font-size="12" fill="#5B514A">Upgrades grow this one building: more bays and holders, a second eave, a bigger sign.</text>
  <text x="740" y="602" font-size="12" fill="#5B514A">Interior PointLights in the lanterns and hearth so the anvil isn't in roof shadow from the forging camera.</text>
</svg>
