<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialogue Editor</title>
<style>
:root {
	--bg: #17130f; --panel: #221c16; --panel2: #2b241c; --line: #3a3027; --text: #f1e7d8; --dim: #a8987f;
	--accent: #e8a33c; --gold: #f2c552; --changed: #e8a33c; --bad: #e0614f; --good: #7bbf6a; --paper: #efe3c8; --ink: #3a2a18;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #120f0c; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0 8px 0 0; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { background: none; border: 0; color: var(--dim); padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
nav button.on { background: var(--panel2); color: var(--text); }
nav .badge { background: var(--accent); color: #1a1208; border-radius: 9px; padding: 0 6px; font-size: 12px; font-weight: 700; margin-left: 4px; }
#status { margin-left: auto; color: var(--dim); font-size: 12px; }
main { padding: 16px; max-width: 1200px; margin: 0 auto; }
h2 { font-size: 15px; margin: 22px 0 8px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
h3 { font-size: 14px; margin: 0 0 6px; }
.hint { color: var(--dim); font-size: 12.5px; margin: 0 0 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.key { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.key b { font-size: 13px; }
.key small { color: var(--dim); }
.lines { display: flex; flex-direction: column; gap: 5px; }
.row { display: flex; gap: 6px; align-items: flex-start; }
.row textarea, .field input, .field select { flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-left: 3px solid transparent; border-radius: 7px; padding: 6px 8px; font: inherit; resize: none; overflow: hidden; min-height: 32px; }
.row textarea:focus, .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.changed { border-left-color: var(--changed) !important; }
.warn { color: var(--bad); font-size: 12px; margin: 2px 0 0 2px; }
.x { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 6px; }
.x:hover { color: var(--bad); background: var(--panel2); }
.add, .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 12.5px; }
.add { color: var(--dim); align-self: flex-start; }
.btn.primary { background: var(--accent); color: #1a1208; border-color: var(--accent); font-weight: 600; }
.btn:hover, .add:hover { border-color: var(--accent); }
.tok { color: var(--gold); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
/* visit flow */
.flow { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 4px 0 12px; }
.stage { min-width: 150px; display: flex; flex-direction: column; gap: 6px; }
.stage .title { font-size: 11.5px; text-transform: uppercase; color: var(--dim); letter-spacing: .05em; }
.arrow { align-self: center; color: var(--dim); padding: 0 8px; font-size: 20px; }
.node { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; cursor: pointer; font-size: 13px; }
.node:hover { border-color: var(--accent); }
.node small { display: block; color: var(--dim); font-size: 11.5px; }
.node.ok { border-left: 3px solid var(--good); } .node.no { border-left: 3px solid var(--bad); } .node.own { border-left: 3px solid var(--gold); }
/* characters */
.split { display: grid; grid-template-columns: 230px 1fr; gap: 14px; }
.split > * { min-width: 0; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
.list { display: flex; flex-direction: column; gap: 4px; }
.list button { display: flex; align-items: center; gap: 9px; text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 9px; padding: 7px 9px; cursor: pointer; font: inherit; }
.list button.on { border-color: var(--accent); background: var(--panel2); }
.list button small { color: var(--dim); display: block; font-size: 11.5px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #1a1208; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--panel2); color: var(--dim); }
.pill.vip { background: var(--gold); color: #1a1208; font-weight: 700; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--changed); flex: none; margin-left: auto; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--dim); }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 10px 0; }
.uses { color: var(--dim); font-size: 12.5px; font-style: italic; }
/* chat preview */
.chat { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.say { align-self: flex-start; background: #fff; color: #222; border-radius: 12px; padding: 6px 11px; max-width: 80%; font-size: 13.5px; }
.act { align-self: flex-end; color: var(--dim); font-size: 12px; font-style: italic; }
/* letters */
.paper { background: var(--paper); color: var(--ink); border-radius: 6px; padding: 14px 16px; font-family: Georgia, serif; font-size: 15px; line-height: 1.5; box-shadow: 0 2px 0 #00000040; }
.paper mark { background: none; color: #a4421c; font-weight: 700; }
.paper .from { font-size: 12px; color: #7a6040; margin-top: 8px; font-family: system-ui, sans-serif; }
.chain { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.chain > .card { flex: 1 1 420px; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
th { color: var(--dim); font-weight: 500; font-size: 12px; }
del { color: var(--bad); } ins { color: var(--good); text-decoration: none; }
.empty { color: var(--dim); padding: 30px; text-align: center; }
</style>
</head>
<body>
<header>
	<h1>Dialogue Editor</h1>
	<nav id="tabs"></nav>
	<span id="status">Loading…</span>
</header>
<main id="main"></main>

<script>
// studio = what the game has (studio.json, exported from Studio); data = the edited copy (edits.json), autosaved.
let studio, data, tab = "visit", pickedCast = 0;

// What each customer line key is for, in visit order. {tokens} each key can use.
const KEYS = {
	greet: ["Walks in", "Named characters only, as they come in", []],
	empty: ["Nothing on display", "No sword for sale when they arrive", []],
	wait: ["All swords taken", "Every sword already has a customer", []],
	look: ["Looks at the sword", "Plain remark ({name} = the sword's name)", ["name"]],
	rare: ["…Rare / Epic metal", "Remark when the metal is Rare or Epic", ["metal", "name"]],
	legend: ["…Legendary / Secret", "Remark for Legendary and Secret metals", ["metal", "name"]],
	etched: ["…Etched sword", "Remark when the sword is etched", ["name"]],
	polished: ["…Polished sword", "Remark when it's polished", ["name"]],
	edge: ["…95%+ forge", "Remark for a near-perfect edge", ["name"]],
	offer: ["Makes an offer", "{offer} = the coins", ["offer"]],
	deal: ["You accept", "Said as they carry it out", []],
	raise: ["You decline → they raise", "Then a new offer line follows (VIPs never raise)", []],
	walk: ["You decline → they leave", "", []],
	later: ["Gives up", "No free sword for them, or your offer card timed out", []],
};
const CAST_KEYS = ["greet", "look", "offer", "raise", "deal", "walk"];

const $ = (tag, attrs = {}, ...kids) => {
	const el = document.createElement(tag);
	for (const [k, v] of Object.entries(attrs)) {
		if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
		else if (k === "class") el.className = v;
		else if (v !== undefined && v !== null && v !== false) el.setAttribute(k, v);
	}
	for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) el.append(k.nodeType ? k : String(k));
	return el;
};
const clone = (o) => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const get = (obj, path) => path.reduce((o, k) => (o == null ? undefined : o[k]), obj);
const tokens = (s) => [...String(s).matchAll(/\{([^}]+)\}/g)].map((m) => m[1]);
const bpName = (id) => (studio.blueprints.find((b) => b.id === id) || {}).name || id || "any blade";
const sender = (id) => data.senders.find((s) => s.id === id) || { name: id, role: "" };
const castById = (id) => studio.cast.find((c) => c.id === id);
const pick = (a) => a[Math.floor(Math.random() * a.length)];

// ---------- saving ----------
let saveTimer;
function changed() {
	clearTimeout(saveTimer);
	setStatus("Saving…");
	saveTimer = setTimeout(save, 400);
	renderTabs();
}
async function save() {
	const dirty = !same(strip(data), strip(studio));
	const res = await fetch("/edits", dirty ? { method: "POST", body: JSON.stringify(data, null, "\t") } : { method: "DELETE" });
	setStatus(res.ok ? (dirty ? "Saved to edits.json" : "No edits: matches the game") : "Save failed: " + (await res.text()));
}
const strip = (d) => { const c = clone(d); delete c.exportedAt; return c; };
const setStatus = (t) => (document.getElementById("status").textContent = t);

// ---------- diff ----------
function diff() {
	const out = [];
	const label = (path) => {
		const [root, i, ...rest] = path;
		const item = root === "customerLines" ? "Shop line" : root === "cast" ? (data.cast[i] || studio.cast[i]).name
			: root === "senders" ? "Mail · " + (data.senders[i] || studio.senders[i]).name
			: root === "commissions" ? "Quest · " + (data.commissions[i] || studio.commissions[i]).id
			: root === "tutorial" ? "Tutorial hint" : root;
		const tail = root === "customerLines" ? [i, ...rest] : rest;
		return item + (tail.length ? " · " + tail.filter((k) => typeof k === "string" && k !== "lines").join(" · ") : "");
	};
	const walk = (a, b, path) => {
		if (same(a, b)) return;
		if (Array.isArray(a) || Array.isArray(b)) {
			const A = a || [], B = b || [];
			if (A.every((x) => typeof x === "string") && B.every((x) => typeof x === "string")) {
				for (let i = 0; i < Math.max(A.length, B.length); i++) if (A[i] !== B[i]) out.push({ where: label(path), old: A[i], neu: B[i] });
				return;
			}
			for (let i = 0; i < Math.max(A.length, B.length); i++) walk(A[i], B[i], [...path, i]);
			return;
		}
		if (a && b && typeof a === "object" && typeof b === "object") {
			for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) walk(a[k], b[k], [...path, k]);
			return;
		}
		out.push({ where: label(path), old: a, neu: b });
	};
	for (const k of ["customerLines", "cast", "senders", "commissions", "tutorial"]) walk(studio[k], data[k], [k]);
	return out;
}

// ---------- line list editor ----------
// arr: data array being edited; base: the game's array (for highlighting); allowed: tokens this line may use (null = any)
function lineList(arr, base, allowed, opts = {}) {
	const box = $("div", { class: "lines" });
	const draw = () => {
		box.replaceChildren();
		arr.forEach((text, i) => {
			const ta = $("textarea", { rows: 1, class: base && base.includes(text) ? "" : "changed" });
			ta.value = text;
			const warn = $("div", { class: "warn" });
			const check = () => {
				const bad = allowed ? tokens(ta.value).filter((t) => !allowed.includes(t)) : [];
				warn.textContent = bad.length ? `Unknown {${bad.join("}, {")}}: the game leaves it as typed` : (opts.check ? opts.check(ta.value) : "");
			};
			const grow = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
			ta.addEventListener("input", () => {
				arr[i] = ta.value;
				ta.classList.toggle("changed", !(base && base.includes(ta.value)));
				check(); grow(); changed(); opts.onchange && opts.onchange();
			});
			requestAnimationFrame(grow);
			check();
			const row = $("div", { class: "row" }, ta);
			if (!opts.fixed) row.append($("button", { class: "x", title: "Remove line", onclick: () => {
				if (arr.length === 1 && opts.keepOne) return alert("Needs at least one line.");
				arr.splice(i, 1); draw(); changed(); opts.onchange && opts.onchange();
			} }, "×"));
			box.append($("div", {}, row, warn));
		});
		if (!opts.fixed) box.append($("button", { class: "add", onclick: () => { arr.push(""); draw(); changed(); box.querySelectorAll("textarea")[arr.length - 1].focus(); } }, "+ line"));
	};
	draw();
	return box;
}
const keyHead = (k, extra) => $("div", { class: "key" }, $("b", {}, KEYS[k][0]), $("small", {}, KEYS[k][1]),
	KEYS[k][2].length ? $("span", { class: "tok" }, KEYS[k][2].map((t) => `{${t}}`).join(" ")) : null, extra);

// ---------- tabs ----------
const TABS = [["visit", "Shop visits"], ["cast", "Characters"], ["mail", "Mail senders"], ["quests", "Story quests"], ["tutorial", "Tutorial hints"], ["changes", "Changes"]];
function renderTabs() {
	const n = diff().length;
	document.getElementById("tabs").replaceChildren(...TABS.map(([id, name]) =>
		$("button", { class: tab === id ? "on" : "", onclick: () => { tab = id; render(); } }, name,
			id === "changes" && n ? $("span", { class: "badge" }, n) : null)));
}
function render() {
	renderTabs();
	const main = document.getElementById("main");
	main.replaceChildren(VIEWS[tab]());
	window.scrollTo(0, 0);
}

// The visit as a flow. own: a cast member (their own keys marked), or null for every customer.
function flow(own, jump) {
	const node = (k, cls = "") => {
		const has = own && own.lines && own.lines[k];
		return $("div", { class: "node " + cls + (has ? " own" : ""), onclick: () => jump(k) }, KEYS[k][0],
			$("small", {}, own ? (has ? `own · ${own.lines[k].length}` : `shop line`) : `${(data.customerLines[k] || []).length} lines`));
	};
	const stage = (title, ...nodes) => $("div", { class: "stage" }, $("div", { class: "title" }, title), ...nodes);
	const arrow = () => $("div", { class: "arrow" }, "→");
	const stages = [];
	if (!own || own.lines?.greet) stages.push(stage("Arrive", own ? node("greet") : $("div", { class: "node", onclick: () => { tab = "cast"; render(); } }, "Walks in", $("small", {}, "named characters greet")), ...(own ? [] : [node("empty"), node("wait")])), arrow());
	stages.push(stage("Look", node("look"), ...(own ? [$("small", { class: "uses" }, own.lines?.look ? "own look line 60% of the time, else the shop's remarks" : "")] : ["rare", "legend", "etched", "polished", "edge"].map((k) => node(k)))), arrow());
	stages.push(stage("Offer", node("offer")), arrow());
	stages.push(stage("Your answer", node("deal", "ok"), ...(own && own.vip ? [] : [node("raise", "no")]), node("walk", "no"), node("later")));
	return $("div", { class: "card flow" }, ...stages);
}

// A pretend visit, so lines can be read in order.
function simulate(c) {
	const line = (k, fill = {}) => {
		const pool = (c && c.lines && c.lines[k] && c.lines[k].length ? c.lines[k] : data.customerLines[k]) || ["…"];
		return pick(pool).replace(/\{(\w+)\}/g, (m, t) => (fill[t] ?? m));
	};
	const sword = c && c.likesBlueprint ? bpName(c.likesBlueprint) : pick(studio.blueprints.filter((b) => !b.big)).name;
	const metal = pick(["Iron", "Gold", "Mythril", "Dragonite"]);
	const out = [];
	let offer = 100 + Math.floor(Math.random() * 200);
	if (c && c.lines && c.lines.greet) out.push(["say", line("greet")]);
	out.push(["act", `looks at a ${metal} ${sword}`]);
	const lookKey = c && c.lines && c.lines.look && Math.random() < 0.6 ? "look" : pick(["look", "rare", "polished", "etched", "edge"]);
	out.push(["say", line(lookKey, { name: `${metal} ${sword}`, metal })]);
	for (let round = 0; round < 3; round++) {
		out.push(["say", line("offer", { offer })]);
		const r = Math.random();
		if (r < 0.45 || round === 2) { out.push(["act", "you accept"], ["say", line("deal")]); break; }
		out.push(["act", "you decline"]);
		if ((c && c.vip) || r < 0.6) { out.push(["say", line("walk")]); break; }
		out.push(["say", line("raise")]);
		offer = Math.round(offer * 1.1);
	}
	return $("div", { class: "chat" }, out.map(([kind, t]) => $("div", { class: kind }, t)));
}

const VIEWS = {
	visit() {
		const wrap = $("div");
		const sections = {};
		const jump = (k) => sections[k] && sections[k].scrollIntoView({ behavior: "smooth", block: "center" });
		wrap.append($("p", { class: "hint" }, "Every walk-in's lines, in the order of a visit. One line is picked at random each time. Named characters use their own lines where they have them (Characters tab) and these for the rest. Click a step to jump to its lines."),
			flow(null, jump));
		const sim = $("div");
		wrap.append($("div", { class: "card", style: "margin-top:12px" }, $("div", { class: "key" }, $("b", {}, "Example visit"),
			$("button", { class: "btn", onclick: () => sim.replaceChildren(simulate(null)) }, "Play another")), sim));
		sim.append(simulate(null));
		const groups = [["Arriving", ["empty", "wait", "later"]], ["Looking at the sword", ["look", "rare", "legend", "etched", "polished", "edge"]], ["Haggling", ["offer", "deal", "raise", "walk"]]];
		for (const [title, keys] of groups) {
			wrap.append($("h2", {}, title));
			const grid = $("div", { class: "grid" });
			for (const k of keys) {
				const card = $("div", { class: "card" }, keyHead(k), lineList(data.customerLines[k], studio.customerLines[k], KEYS[k][2], { keepOne: true }));
				sections[k] = card;
				grid.append(card);
			}
			wrap.append(grid);
		}
		return wrap;
	},

	cast() {
		const list = $("div", { class: "list" });
		const detail = $("div");
		const draw = () => {
			list.replaceChildren(...data.cast.map((c, i) => $("button", { class: i === pickedCast ? "on" : "", onclick: () => { pickedCast = i; draw(); } },
				$("div", { class: "avatar", style: `background:${c.vip ? "var(--gold)" : "#8fae6a"}` }, c.name[0]),
				$("div", {}, c.name, $("small", {}, c.vip ? "VIP · buys any sword" : `Client · wants ${bpName(c.likesBlueprint)}`)),
				same(c, studio.cast[i]) ? null : $("span", { class: "dot", title: "edited" }))));
			const c = data.cast[pickedCast], base = studio.cast[pickedCast];
			const sections = {};
			const jump = (k) => sections[k] && sections[k].scrollIntoView({ behavior: "smooth", block: "center" });
			const sim = $("div");
			const fields = $("div", { class: "fields" });
			if (!c.vip) {
				const sel = $("select", { class: c.likesBlueprint === base.likesBlueprint ? "" : "changed",
					onchange: (e) => { c.likesBlueprint = e.target.value; changed(); draw(); } },
					studio.blueprints.map((b) => $("option", { value: b.id, selected: b.id === c.likesBlueprint ? "" : null }, b.name + (b.big ? " (big)" : ""))));
				fields.append($("label", { class: "field" }, "Wants (comes only while one is on display, pays ×1.25)", sel));
			}
			detail.replaceChildren(
				$("div", { class: "card" },
					$("div", { class: "key" }, $("h3", {}, c.name), c.vip ? $("span", { class: "pill vip" }, "VIP") : $("span", { class: "pill" }, "Client"),
						$("small", {}, `model ServerStorage.Cast.${c.id}`)),
					$("p", { class: "hint" }, c.vip ? "A VIP: 2-3.5× the sword's value, no raise, 60 s to answer. Half of VIP walk-ins are a named one."
						: "A regular who heads for their sword. 10% of walk-ins after the tutorial, when their sword is on display."),
					fields, flow(c, jump),
					$("div", { class: "key", style: "margin-top:10px" }, $("b", {}, "Example visit"), $("button", { class: "btn", onclick: () => sim.replaceChildren(simulate(c)) }, "Play another")), sim),
			);
			sim.append(simulate(c));
			const grid = $("div", { class: "grid", style: "margin-top:12px" });
			for (const k of CAST_KEYS) {
				if (k === "raise" && c.vip) continue;
				const own = c.lines[k];
				const card = $("div", { class: "card" }, keyHead(k));
				if (own) {
					card.append(lineList(own, base.lines[k], KEYS[k][2], { onchange: () => {} }),
						$("button", { class: "add", style: "margin-top:6px", onclick: () => { delete c.lines[k]; changed(); draw(); } }, "Use the shop's lines instead"));
				} else {
					card.append($("div", { class: "uses" }, `Uses the shop's ${KEYS[k][0].toLowerCase()} lines` + (k === "greet" ? " (none: says nothing coming in)" : "")),
						$("button", { class: "add", style: "margin-top:6px", onclick: () => { c.lines[k] = [""]; changed(); draw(); } }, "Write their own"));
				}
				sections[k] = card;
				grid.append(card);
			}
			detail.append(grid);
		};
		draw();
		return $("div", {}, $("p", { class: "hint" }, "Named characters walking into the shop. Gold-edged steps are their own lines; the rest come from Shop visits."),
			$("div", { class: "split" }, list, detail));
	},

	mail() {
		const grid = $("div", { class: "grid" });
		const example = (s, t) => {
			const sword = "polished Katana";
			return t.replace(/a \{sword\}/g, (/^[aeiou]/i.test(sword) ? "an " : "a ") + sword).replace(/\{sword\}/g, sword);
		};
		data.senders.forEach((s, i) => {
			const base = studio.senders[i];
			const previews = $("div", { class: "chat" });
			const drawPreview = () => previews.replaceChildren(...s.lines.map((t) => {
				const p = $("div", { class: "paper" });
				const html = example(s, t).split("polished Katana");
				html.forEach((part, j) => { p.append(part); if (j < html.length - 1) p.append($("mark", {}, "polished Katana")); });
				p.append($("div", { class: "from" }, `— ${s.name}, ${s.role}`));
				return p;
			}));
			drawPreview();
			grid.append($("div", { class: "card" },
				$("div", { class: "key" }, $("div", { class: "avatar", style: `background:${s.shirt};color:${s.skin};border:3px solid ${s.skin}` }, s.name[0]),
					$("div", {}, $("b", {}, s.name), $("div", { class: "hint", style: "margin:0" }, s.role)),
					s.orders ? $("span", { class: "pill" }, "sends orders") : $("span", { class: "pill vip" }, "story quests")),
				s.orders ? $("p", { class: "hint" }, "One line per order letter, picked by order number. {sword} = what they want, e.g. “etched Katana in Gold”; “a {sword}” becomes “an” before a vowel.")
					: $("p", { class: "hint" }, "Writes the story quests (their letter text is on the Story quests tab). These lines aren't used while they send no orders."),
				lineList(s.lines, base.lines, ["sword"], { keepOne: true, onchange: drawPreview }),
				$("div", { class: "hint", style: "margin:10px 0 4px" }, "On the paper:"), previews));
		});
		return $("div", {}, $("p", { class: "hint" }, "Villagers who write to your mail."), grid);
	},

	quests() {
		const chain = $("div", { class: "chain" });
		data.commissions.forEach((c, i) => {
			const base = studio.commissions[i];
			const paper = $("div", { class: "paper" });
			const drawPaper = () => {
				paper.replaceChildren();
				const at = c.want ? c.letter.indexOf(c.want) : -1;
				if (at < 0) paper.append(c.letter);
				else paper.append(c.letter.slice(0, at), $("mark", {}, c.want), c.letter.slice(at + c.want.length));
				paper.append($("div", { class: "from" }, `— ${sender(c.giver).name}, ${sender(c.giver).role}`));
			};
			drawPaper();
			const f = (key, label, kind, opts) => {
				const cls = same(c[key], base[key]) ? "" : "changed";
				let input;
				if (kind === "select") {
					input = $("select", { class: cls, onchange: (e) => { c[key] = e.target.value || undefined; if (c[key] === undefined) delete c[key]; changed(); render(); } },
						opts.map(([v, t]) => $("option", { value: v, selected: (c[key] ?? "") === v ? "" : null }, t)));
				} else if (kind === "check") {
					input = $("select", { class: cls, onchange: (e) => { c[key] = e.target.value === "yes"; changed(); render(); } },
						$("option", { value: "yes", selected: c[key] ? "" : null }, "Yes"), $("option", { value: "no", selected: c[key] ? null : "" }, "No"));
				} else {
					input = $("input", { class: cls, type: kind, value: c[key] ?? "", onchange: (e) => {
						const v = kind === "number" ? Number(e.target.value) : e.target.value;
						if (e.target.value === "") delete c[key]; else c[key] = v;
						changed(); render();
					} });
				}
				return $("label", { class: "field" }, label, input);
			};
			const letterBox = $("textarea", { rows: 3, class: c.letter === base.letter ? "" : "changed",
				oninput: (e) => { c.letter = e.target.value; e.target.classList.toggle("changed", c.letter !== base.letter); count.textContent = countText(); drawPaper(); changed(); } });
			letterBox.value = c.letter;
			const countText = () => `${c.letter.length} characters · the paper holds about 3 lines (≈125). ${c.want && !c.letter.includes(c.want) ? "⚠ highlighted words not found in the letter" : ""}`;
			const count = $("div", { class: "hint" }, countText());
			const stillAfter = c.after ? `after quest “${c.after}” is handed in, ` : "";
			chain.append($("div", { class: "card" },
				$("div", { class: "key" }, $("h3", {}, `${i + 1}. ${c.id}`), $("small", {}, `arrives ${stillAfter}after shop sale #${c.afterSales}${c.afterUpgrade ? ", once " + c.afterUpgrade + " is bought" : ""}`)),
				paper,
				$("div", { class: "row", style: "margin-top:10px" }, letterBox), count,
				$("div", { class: "fields" },
					f("giver", "From", "select", data.senders.map((s) => [s.id, `${s.name} (${s.role})`])),
					f("want", "Highlighted words", "text"),
					f("blueprintId", "Sword", "select", [["", "Any blade"], ...studio.blueprints.map((b) => [b.id, b.name])]),
					f("materialId", "Metal (blank = any)", "text"),
					f("minPercent", "Min forge %", "number"),
					f("polished", "Must be polished", "check"),
					f("reward", "Reward coins", "number"),
					f("gems", "Reward gems", "number"),
					f("afterSales", "After shop sale #", "number"),
					f("afterUpgrade", "After upgrade id", "text"),
				),
				$("p", { class: "hint" }, "The first quest also drives the tutorial (Iron pulls lean to its metal, the Guide points at its sword); changing its sword or metal changes that too.")));
		});
		return $("div", {}, $("p", { class: "hint" }, "Story letters, in order. Each comes once, by mail, a few minutes after its trigger. You hand the sword in from the inbox."), chain);
	},

	tutorial() {
		const tbody = $("tbody");
		data.tutorial.forEach((t, i) => {
			const base = studio.tutorial[i];
			const baseToks = tokens(base.text).sort().join();
			const ta = lineList([t.text], [base.text], null, { fixed: true,
				check: (v) => (t.template && tokens(v).sort().join() !== baseToks ? `Keep the code in braces exactly: ${tokens(base.text).map((x) => `{${x}}`).join(" ")}` : "") });
			// lineList edits its own array: copy back
			ta.addEventListener("input", (e) => { t.text = e.target.value; changed(); });
			tbody.append($("tr", {}, $("td", { style: "width:65%" }, ta), $("td", {}, t.template ? $("span", { class: "tok" }, "filled by code") : ""),
				$("td", { class: "hint" }, "Guide line " + t.lines.join(", "))));
		});
		return $("div", {}, $("p", { class: "hint" }, "The tutorial's one-line instruction at the top of the screen. A few texts are also checked by the Guide's code (e.g. “Put it on display”); renaming one renames every use."),
			$("div", { class: "card" }, $("table", {}, $("thead", {}, $("tr", {}, $("th", {}, "Hint"), $("th", {}, ""), $("th", {}, "Where"))), tbody)));
	},

	changes() {
		const d = diff();
		if (!d.length) return $("div", { class: "empty" }, "No edits yet. Everything matches the game (exported " + studio.exportedAt + ").");
		const fmt = (v) => (v === undefined ? $("span", { class: "hint" }, "—") : typeof v === "object" ? JSON.stringify(v) : String(v));
		return $("div", {},
			$("p", { class: "hint" }, `${d.length} change${d.length > 1 ? "s" : ""}, saved in Development/Dialogue Editor/edits.json. Ask Claude to “wire the dialogue edits into Studio”.`),
			$("div", { class: "card" }, $("table", {},
				$("thead", {}, $("tr", {}, $("th", {}, "Where"), $("th", {}, "In the game"), $("th", {}, "Your edit"))),
				$("tbody", {}, d.map((x) => $("tr", {}, $("td", {}, x.where), $("td", {}, $("del", {}, fmt(x.old))), $("td", {}, $("ins", {}, fmt(x.neu)))))))),
			$("p", {}, $("button", { class: "btn", onclick: async () => {
				if (!confirm("Throw away every edit and go back to what the game has?")) return;
				await fetch("/edits", { method: "DELETE" }); location.reload();
			} }, "Discard all edits")));
	},
};

(async () => {
	const s = await fetch("studio.json");
	if (!s.ok) return (document.getElementById("main").innerHTML = '<div class="empty">No studio.json yet: ask Claude to export the dialogue from Studio.</div>');
	studio = await s.json();
	const e = await fetch("edits.json");
	data = e.ok ? await e.json() : clone(studio);
	setStatus(e.ok ? "Loaded your saved edits" : `Matches the game · exported ${studio.exportedAt.slice(0, 16).replace("T", " ")}`);
	render();
})();
</script>
</body>
</html>
